version: "3.5"
services:
  operator:
    build:
      context: operator
      args:
        UPSTREAM_VERSION: v1.3.0
        STAKER_SCRIPTS_VERSION: v0.1.2
    restart: unless-stopped
    volumes:
      - operator-data:/root/.anchor
      - operator-keys:/root/keys
    environment:
      LOG_LEVEL: info
      SETUP_MODE: ""
      EXTRA_OPTS: ""
      EXISTING_PASSWORD: ""
      NEW_PASSWORD: ""
  dkg:
    build:
      context: dkg
      args:
        DKG_IMAGE: public.ecr.aws/h4h2r1n7/dkg@sha256:117a70e6c92b7b9a0943a309649bf99ca1d1c7c50b408d6cfc2527090732e404
        STAKER_SCRIPTS_VERSION: v0.1.2
    restart: on-failure
    volumes:
      - operator-keys:/root/keys
      - dkg-data:/data/dkg
    environment:
      LOG_LEVEL: info
      OPERATOR_ID: ""
      EXTRA_OPTS: ""
volumes:
  operator-data: {}
  operator-keys: {}
  dkg-data: {}
